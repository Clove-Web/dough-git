services:
  minigit:
    build: .
    image: dough-git:latest
    container_name: dough-git
    restart: unless-stopped

    # Secrets + PocketID config live in .env (see .env.example).
    env_file:
      - .env

    # In-container overrides so it binds all interfaces and finds the repos
    # volume regardless of what .env says.
    environment:
      MINIGIT_HOST: "0.0.0.0"
      MINIGIT_PORT: "4010"
      MINIGIT_REPOS_ROOT: /srv/git
      MINIGIT_STATIC_DIR: /app/public

    # Bind to localhost only — nginx (backup.doughmination.gay) proxies to this.
    ports:
      - "127.0.0.1:4010:4010"

    # Your bare repositories. Back this directory up and that's your whole
    # git mirror. Point the left side wherever you keep them on the host.
    volumes:
      - ./data/repos:/srv/git
